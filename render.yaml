services:
  - type: web
    name: pageturner-san-mateo
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: pageturner-vault
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: APP_PASSCODE
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
